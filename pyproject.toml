[project]
name = "claims-lakehouse"
version = "0.1.0"
description = "Medallion-architecture healthcare claims pipeline in PySpark (synthetic data)"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
